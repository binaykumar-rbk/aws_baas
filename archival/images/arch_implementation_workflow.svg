<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="752"
     viewBox="0 0 840 752"
     font-family="Segoe UI, Calibri, Arial, sans-serif">

<!-- Height: Phase1(93) + arrow(24) + Phase2(78) + arrow(24) + Phase3(78)
     + arrow(24) + Phase4(78) + arrow(24) + Phase5(78) + arrow(24) + Phase6(93)
     + title(72) + gap-before(16) + gap-after(24) + footer(22) = 752px -->

<!-- SVG background -->
<rect width="840" height="752" fill="#F4F7FA" rx="12"/>

<!-- Perimeter border -->
<rect width="840" height="752" fill="none" stroke="#09A8B8" stroke-width="5" rx="12"/>

<!-- Title bar -->
<rect x="0" y="0" width="840" height="72" fill="#0A2347" rx="12"/>
<rect x="0" y="60" width="840" height="12" fill="#0A2347"/>
<rect x="0" y="69" width="840" height="3" fill="#09A8B8"/>
<text x="420" y="34" font-size="18" font-weight="bold" fill="#FFFFFF"
      text-anchor="middle" letter-spacing="0.3">Archiving Implementation Workflow</text>
<text x="420" y="56" font-size="11" fill="#8AACCC"
      text-anchor="middle">Click a phase to navigate to that section</text>

<!-- Vertical connector line (behind phases) -->
<line x1="60" y1="88" x2="60" y2="706"
      stroke="#B0C8E0" stroke-width="2" stroke-dasharray="6,4"/>

<!-- Phase 1: Plan your archival location -->
<rect x="88" y="88" width="728" height="93" rx="8" fill="#FFFFFF"
      stroke="#C8D8E8" stroke-width="1"/>
<rect x="88" y="88" width="728" height="36" fill="#075F68" rx="8"/>
<rect x="88" y="112" width="728" height="12" fill="#075F68"/>
<circle cx="60" cy="106" r="22" fill="#F4F7FA" stroke="#09A8B8" stroke-width="2.5"/>
<text x="60" y="112" font-size="16" font-weight="bold" fill="#09A8B8"
      text-anchor="middle">1</text>
<text x="452" y="112" font-size="13" font-weight="bold" fill="#FFFFFF"
      text-anchor="middle">Plan your archival location</text>
<text x="452" y="146" font-size="10" fill="#4A6A8A" text-anchor="middle">Choose a storage provider based on immutability, cost, compliance, and network connectivity.</text>
<text x="452" y="161" font-size="10" fill="#4A6A8A" text-anchor="middle">For cloud archival locations, add the cloud account to RSC.</text>

<!-- Arrow 1 -->
<line x1="60" y1="181" x2="60" y2="201" stroke="#B0C8E0" stroke-width="2"/>
<polygon points="53,197 60,205 67,197" fill="#09A8B8"/>

<!-- Phase 2: Create the archival location -->
<rect x="88" y="205" width="728" height="78" rx="8" fill="#FFFFFF"
      stroke="#C8D8E8" stroke-width="1"/>
<rect x="88" y="205" width="728" height="36" fill="#0C3460" rx="8"/>
<rect x="88" y="229" width="728" height="12" fill="#0C3460"/>
<circle cx="60" cy="223" r="22" fill="#F4F7FA" stroke="#09A8B8" stroke-width="2.5"/>
<text x="60" y="229" font-size="16" font-weight="bold" fill="#09A8B8"
      text-anchor="middle">2</text>
<text x="452" y="229" font-size="13" font-weight="bold" fill="#FFFFFF"
      text-anchor="middle">Create the archival location</text>
<text x="452" y="263" font-size="10" fill="#4A6A8A" text-anchor="middle">Create a new archival location for your selected provider in RSC.</text>

<!-- Arrow 2 -->
<line x1="60" y1="283" x2="60" y2="303" stroke="#B0C8E0" stroke-width="2"/>
<polygon points="53,299 60,307 67,299" fill="#09A8B8"/>

<!-- Phase 3: Configure an SLA Domain archival policy -->
<rect x="88" y="307" width="728" height="78" rx="8" fill="#FFFFFF"
      stroke="#C8D8E8" stroke-width="1"/>
<rect x="88" y="307" width="728" height="36" fill="#0B3A72" rx="8"/>
<rect x="88" y="331" width="728" height="12" fill="#0B3A72"/>
<circle cx="60" cy="325" r="22" fill="#F4F7FA" stroke="#09A8B8" stroke-width="2.5"/>
<text x="60" y="331" font-size="16" font-weight="bold" fill="#09A8B8"
      text-anchor="middle">3</text>
<text x="452" y="331" font-size="13" font-weight="bold" fill="#FFFFFF"
      text-anchor="middle">Configure an SLA Domain archival policy</text>
<text x="452" y="365" font-size="10" fill="#4A6A8A" text-anchor="middle">Add an archival policy to an SLA Domain &#x2014; set frequency, retention period, and location.</text>

<!-- Arrow 3 -->
<line x1="60" y1="385" x2="60" y2="405" stroke="#B0C8E0" stroke-width="2"/>
<polygon points="53,401 60,409 67,401" fill="#09A8B8"/>

<!-- Phase 4: Assign the SLA Domain to workloads -->
<rect x="88" y="409" width="728" height="78" rx="8" fill="#FFFFFF"
      stroke="#C8D8E8" stroke-width="1"/>
<rect x="88" y="409" width="728" height="36" fill="#0C3460" rx="8"/>
<rect x="88" y="433" width="728" height="12" fill="#0C3460"/>
<circle cx="60" cy="427" r="22" fill="#F4F7FA" stroke="#09A8B8" stroke-width="2.5"/>
<text x="60" y="433" font-size="16" font-weight="bold" fill="#09A8B8"
      text-anchor="middle">4</text>
<text x="452" y="433" font-size="13" font-weight="bold" fill="#FFFFFF"
      text-anchor="middle">Assign the SLA Domain to workloads</text>
<text x="452" y="467" font-size="10" fill="#4A6A8A" text-anchor="middle">Assign the SLA Domain to the data center workloads you want to archive.</text>

<!-- Arrow 4 -->
<line x1="60" y1="487" x2="60" y2="507" stroke="#B0C8E0" stroke-width="2"/>
<polygon points="53,503 60,511 67,503" fill="#09A8B8"/>

<!-- Phase 5: Monitor archival jobs -->
<rect x="88" y="511" width="728" height="78" rx="8" fill="#FFFFFF"
      stroke="#C8D8E8" stroke-width="1"/>
<rect x="88" y="511" width="728" height="36" fill="#075F68" rx="8"/>
<rect x="88" y="535" width="728" height="12" fill="#075F68"/>
<circle cx="60" cy="529" r="22" fill="#F4F7FA" stroke="#09A8B8" stroke-width="2.5"/>
<text x="60" y="535" font-size="16" font-weight="bold" fill="#09A8B8"
      text-anchor="middle">5</text>
<text x="452" y="535" font-size="13" font-weight="bold" fill="#FFFFFF"
      text-anchor="middle">Monitor archival jobs</text>
<text x="452" y="569" font-size="10" fill="#4A6A8A" text-anchor="middle">Verify archival jobs are running successfully in the RSC Activity Log.</text>

<!-- Arrow 5 (final — recovery green) -->
<line x1="60" y1="589" x2="60" y2="609" stroke="#B0C8E0" stroke-width="2"/>
<polygon points="53,605 60,613 67,605" fill="#21DDAA"/>

<!-- Phase 6: Recover data from archival locations -->
<rect x="88" y="613" width="728" height="93" rx="8" fill="#FFFFFF"
      stroke="#C8D8E8" stroke-width="1"/>
<rect x="88" y="613" width="728" height="36" fill="#0A4030" rx="8"/>
<rect x="88" y="637" width="728" height="12" fill="#0A4030"/>
<circle cx="60" cy="631" r="22" fill="#F4F7FA" stroke="#21DDAA" stroke-width="2.5"/>
<text x="60" y="637" font-size="16" font-weight="bold" fill="#21DDAA"
      text-anchor="middle">6</text>
<text x="452" y="637" font-size="13" font-weight="bold" fill="#FFFFFF"
      text-anchor="middle">Recover data from archival locations</text>
<text x="452" y="671" font-size="10" fill="#4A6A8A" text-anchor="middle">Recover data from an archival location when the primary Rubrik cluster is unavailable</text>
<text x="452" y="686" font-size="10" fill="#4A6A8A" text-anchor="middle">or when archived snapshots are needed for restore operations.</text>

<!-- Footer -->
<rect x="0" y="730" width="840" height="22" fill="#0A2347" rx="0"/>
<rect x="0" y="740" width="840" height="12" fill="#0A2347" rx="12"/>
<text x="420" y="745" font-size="9" fill="#4A7A9A"
      text-anchor="middle">Rubrik Security Cloud · Data Center Archival Locations</text>

</svg>
