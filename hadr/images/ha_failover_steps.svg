<?xml version="1.0" encoding="UTF-8"?>
<!-- Height: Step1(72) + conn(24) + Step2(88) + conn(24) + Step3(72)
     + conn(24) + Step4(88) + conn(24) + Step5(72) + conn(24)
     + Step6(88) + padding(40) = 640px -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640"
     viewBox="0 0 800 640"
     font-family="Segoe UI, Calibri, Arial, sans-serif">

  <!-- Step 1: Pause backups on the primary cluster -->
  <rect x="60" y="20" width="720" height="72" rx="6"
        fill="#FFFFFF" stroke="#E6EAE9" stroke-width="1.5"/>
  <circle cx="30" cy="56" r="18" fill="#1DA1DC"/>
  <text x="30" y="61" font-size="15" font-weight="700"
        fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="78" y="50" font-size="14" font-weight="600"
        fill="#273637">Pause backups on the primary cluster</text>
  <text x="78" y="70" font-size="12.5"
        fill="#6C7576">Backup operations pause on the primary cluster.</text>

  <!-- Connector 1→2 -->
  <line x1="30" y1="74" x2="30" y2="142"
        stroke="#E6EAE9" stroke-width="2"/>

  <!-- Step 2: Wait for all snapshots to replicate (clean failover only) -->
  <rect x="60" y="116" width="720" height="88" rx="6"
        fill="#FFFFFF" stroke="#E6EAE9" stroke-width="1.5"/>
  <circle cx="30" cy="160" r="18" fill="#1DA1DC"/>
  <text x="30" y="165" font-size="15" font-weight="700"
        fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="78" y="146" font-size="14" font-weight="600"
        fill="#273637">Wait for all snapshots to replicate (clean failover)</text>
  <text x="78" y="166" font-size="12.5"
        fill="#6C7576">For a clean failover, the system waits until all pending snapshots</text>
  <text x="78" y="182" font-size="12.5"
        fill="#6C7576">have replicated from the primary cluster to the secondary cluster.</text>

  <!-- Connector 2→3 -->
  <line x1="30" y1="178" x2="30" y2="246"
        stroke="#E6EAE9" stroke-width="2"/>

  <!-- Step 3: Transfer archival location ownership -->
  <rect x="60" y="228" width="720" height="72" rx="6"
        fill="#FFFFFF" stroke="#E6EAE9" stroke-width="1.5"/>
  <circle cx="30" cy="264" r="18" fill="#1DA1DC"/>
  <text x="30" y="269" font-size="15" font-weight="700"
        fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="78" y="258" font-size="14" font-weight="600"
        fill="#273637">Transfer archival location ownership</text>
  <text x="78" y="278" font-size="12.5"
        fill="#6C7576">Archival location ownership transfers from the primary cluster to the secondary cluster.</text>

  <!-- Connector 3→4 -->
  <line x1="30" y1="282" x2="30" y2="350"
        stroke="#E6EAE9" stroke-width="2"/>

  <!-- Step 4: Update Rubrik Backup Service on hosts -->
  <rect x="60" y="324" width="720" height="88" rx="6"
        fill="#FFFFFF" stroke="#E6EAE9" stroke-width="1.5"/>
  <circle cx="30" cy="368" r="18" fill="#1DA1DC"/>
  <text x="30" y="373" font-size="15" font-weight="700"
        fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="78" y="354" font-size="14" font-weight="600"
        fill="#273637">Update Rubrik Backup Service on hosts</text>
  <text x="78" y="374" font-size="12.5"
        fill="#6C7576">The Rubrik Backup Service (RBS) on each host is updated to recognize</text>
  <text x="78" y="390" font-size="12.5"
        fill="#6C7576">the secondary cluster as the new primary cluster.</text>

  <!-- Connector 4→5 -->
  <line x1="30" y1="386" x2="30" y2="454"
        stroke="#E6EAE9" stroke-width="2"/>

  <!-- Step 5: Promote protected workloads and resume operations -->
  <rect x="60" y="436" width="720" height="72" rx="6"
        fill="#FFFFFF" stroke="#E6EAE9" stroke-width="1.5"/>
  <circle cx="30" cy="472" r="18" fill="#1DA1DC"/>
  <text x="30" y="477" font-size="15" font-weight="700"
        fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="78" y="466" font-size="14" font-weight="600"
        fill="#273637">Promote protected workloads and resume operations</text>
  <text x="78" y="486" font-size="12.5"
        fill="#6C7576">Protected workloads are promoted on the secondary cluster and incremental backups and uploads resume.</text>

  <!-- Connector 5→6 -->
  <line x1="30" y1="490" x2="30" y2="558"
        stroke="#E6EAE9" stroke-width="2"/>

  <!-- Step 6: Replicate new snapshots to the original primary cluster -->
  <rect x="60" y="532" width="720" height="88" rx="6"
        fill="#FFFFFF" stroke="#E6EAE9" stroke-width="1.5"/>
  <circle cx="30" cy="576" r="18" fill="#1DA1DC"/>
  <text x="30" y="581" font-size="15" font-weight="700"
        fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="78" y="562" font-size="14" font-weight="600"
        fill="#273637">Replicate new snapshots to the original primary cluster</text>
  <text x="78" y="582" font-size="12.5"
        fill="#6C7576">New snapshots replicate from the secondary cluster back to the primary</text>
  <text x="78" y="598" font-size="12.5"
        fill="#6C7576">cluster, if the primary cluster is available.</text>

</svg>
