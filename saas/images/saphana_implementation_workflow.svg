<?xml version="1.0" encoding="UTF-8"?>
<!-- Height calculation:
     72 (title bar) + 16 (gap) +
     78 (Phase 1) + 24 (arrow) +
     78 (Phase 2) + 24 (arrow) +
     78 (Phase 3) + 24 (arrow) +
     140 (Phase 4, 2 subs) + 24 (arrow) +
     78 (Phase 5) + 24 (arrow) +
     78 (Phase 6) +
     24 (gap after last) + 22 (footer) = 784px -->
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="784"
     viewBox="0 0 840 784"
     font-family="Segoe UI, Calibri, Arial, sans-serif">

    <!-- SVG background -->
    <rect width="840" height="784" fill="#F4F7FA" rx="12"/>

    <!-- Perimeter border -->
    <rect width="840" height="784" fill="none" stroke="#09A8B8" stroke-width="5" rx="12"/>

    <!-- Title bar -->
    <rect x="0" y="0" width="840" height="72" fill="#0A2347" rx="12"/>
    <rect x="0" y="60" width="840" height="12" fill="#0A2347"/>
    <rect x="0" y="69" width="840" height="3" fill="#09A8B8"/>
    <text x="420" y="34" font-size="18" font-weight="bold" fill="#FFFFFF"
          text-anchor="middle" letter-spacing="0.3">SAP HANA Protection Implementation Workflow</text>
    <text x="420" y="56" font-size="11" fill="#8AACCC"
          text-anchor="middle">RSC &#x2014; SAP HANA</text>

    <!-- Vertical connector line -->
    <line x1="60" y1="88" x2="60" y2="678"
          stroke="#B0C8E0" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- ============================================================ -->
    <!-- Phase 1: Plan your SAP HANA protection (y=88, height=78) -->
    <!-- ============================================================ -->
    <rect x="88" y="88" width="728" height="78" rx="8"
          fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1"/>
    <rect x="88" y="88" width="728" height="36" fill="#075F68" rx="8"/>
    <rect x="88" y="112" width="728" height="12" fill="#075F68"/>
    <text x="452" y="112" font-size="13" font-weight="bold" fill="#FFFFFF"
          text-anchor="middle">Plan your SAP HANA protection</text>
    <text x="452" y="146" font-size="10" fill="#4A6A8A"
          text-anchor="middle">Review capabilities, verify prerequisites, and plan user access management.</text>
    <circle cx="60" cy="106" r="22" fill="#F4F7FA" stroke="#09A8B8" stroke-width="2.5"/>
    <text x="60" y="112" font-size="16" font-weight="bold" fill="#09A8B8"
          text-anchor="middle">1</text>

    <!-- Arrow 1 to 2 -->
    <line x1="60" y1="166" x2="60" y2="175" stroke="#B0C8E0" stroke-width="2"/>
    <polygon points="53,175 60,183 67,175" fill="#09A8B8"/>

    <!-- ============================================================ -->
    <!-- Phase 2: Set up your SAP HANA system (y=190, height=78) -->
    <!-- ============================================================ -->
    <rect x="88" y="190" width="728" height="78" rx="8"
          fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1"/>
    <rect x="88" y="190" width="728" height="36" fill="#0C3460" rx="8"/>
    <rect x="88" y="214" width="728" height="12" fill="#0C3460"/>
    <text x="452" y="214" font-size="13" font-weight="bold" fill="#FFFFFF"
          text-anchor="middle">Set up your SAP HANA system</text>
    <text x="452" y="248" font-size="10" fill="#4A6A8A"
          text-anchor="middle">Evaluate deployment options, install RBS, add the host and SAP HANA system to RSC.</text>
    <circle cx="60" cy="208" r="22" fill="#F4F7FA" stroke="#09A8B8" stroke-width="2.5"/>
    <text x="60" y="214" font-size="16" font-weight="bold" fill="#09A8B8"
          text-anchor="middle">2</text>

    <!-- Arrow 2 to 3 -->
    <line x1="60" y1="268" x2="60" y2="277" stroke="#B0C8E0" stroke-width="2"/>
    <polygon points="53,277 60,285 67,277" fill="#09A8B8"/>

    <!-- ============================================================ -->
    <!-- Phase 3: Protect SAP HANA databases (y=292, height=78) -->
    <!-- ============================================================ -->
    <rect x="88" y="292" width="728" height="78" rx="8"
          fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1"/>
    <rect x="88" y="292" width="728" height="36" fill="#0B3A72" rx="8"/>
    <rect x="88" y="316" width="728" height="12" fill="#0B3A72"/>
    <text x="452" y="316" font-size="13" font-weight="bold" fill="#FFFFFF"
          text-anchor="middle">Protect SAP HANA databases</text>
    <text x="452" y="350" font-size="10" fill="#4A6A8A"
          text-anchor="middle">Create SLA Domains, assign protection to SAP HANA databases, and take on-demand snapshots.</text>
    <circle cx="60" cy="310" r="22" fill="#F4F7FA" stroke="#09A8B8" stroke-width="2.5"/>
    <text x="60" y="316" font-size="16" font-weight="bold" fill="#09A8B8"
          text-anchor="middle">3</text>

    <!-- Arrow 3 to 4 -->
    <line x1="60" y1="370" x2="60" y2="379" stroke="#B0C8E0" stroke-width="2"/>
    <polygon points="53,379 60,387 67,379" fill="#09A8B8"/>

    <!-- ============================================================ -->
    <!-- Phase 4: System replication and storage snapshots - Optional -->
    <!-- (y=394, height=140, 2 subs) -->
    <!-- ============================================================ -->
    <rect x="88" y="394" width="728" height="140" rx="8"
          fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1"/>
    <rect x="88" y="394" width="728" height="36" fill="#0A4060" rx="8"/>
    <rect x="88" y="418" width="728" height="12" fill="#0A4060"/>
    <text x="452" y="418" font-size="13" font-weight="bold" fill="#FFFFFF"
          text-anchor="middle">System replication &amp; storage snapshots (Optional)</text>
    <text x="452" y="452" font-size="10" fill="#4A6A8A"
          text-anchor="middle">Configure SAP HANA System Replication (HSR) and storage snapshots for Azure deployments.</text>
    <!-- Sub-box 1: System replication -->
    <rect x="108" y="464" width="700" height="28" rx="5"
          fill="#EEF4FA" stroke="#C8D8E8" stroke-width="1"/>
    <text x="452" y="483" font-size="10" fill="#1A2A3A"
          text-anchor="middle">Configure SAP HANA system replication</text>
    <!-- Sub-box 2: Storage snapshots -->
    <rect x="108" y="495" width="700" height="28" rx="5"
          fill="#EEF4FA" stroke="#C8D8E8" stroke-width="1"/>
    <text x="452" y="514" font-size="10" fill="#1A2A3A"
          text-anchor="middle">Configure SAP HANA storage snapshots</text>
    <circle cx="60" cy="412" r="22" fill="#F4F7FA" stroke="#09A8B8" stroke-width="2.5"/>
    <text x="60" y="418" font-size="16" font-weight="bold" fill="#09A8B8"
          text-anchor="middle">4</text>

    <!-- Arrow 4 to 5 -->
    <line x1="60" y1="534" x2="60" y2="543" stroke="#B0C8E0" stroke-width="2"/>
    <polygon points="53,543 60,551 67,543" fill="#09A8B8"/>

    <!-- ============================================================ -->
    <!-- Phase 5: Manage SAP HANA data (y=558, height=78) -->
    <!-- ============================================================ -->
    <rect x="88" y="558" width="728" height="78" rx="8"
          fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1"/>
    <rect x="88" y="558" width="728" height="36" fill="#075F68" rx="8"/>
    <rect x="88" y="582" width="728" height="12" fill="#075F68"/>
    <text x="452" y="582" font-size="13" font-weight="bold" fill="#FFFFFF"
          text-anchor="middle">Manage SAP HANA data</text>
    <text x="452" y="616" font-size="10" fill="#4A6A8A"
          text-anchor="middle">Configure legal holds, adjust snapshot retention, and monitor database protection status.</text>
    <circle cx="60" cy="576" r="22" fill="#F4F7FA" stroke="#09A8B8" stroke-width="2.5"/>
    <text x="60" y="582" font-size="16" font-weight="bold" fill="#09A8B8"
          text-anchor="middle">5</text>

    <!-- Arrow 5 to 6 (recovery — green arrowhead) -->
    <line x1="60" y1="636" x2="60" y2="645" stroke="#B0C8E0" stroke-width="2"/>
    <polygon points="53,645 60,653 67,645" fill="#21DDAA"/>

    <!-- ============================================================ -->
    <!-- Phase 6: Recover SAP HANA data (y=660, height=78) -->
    <!-- ============================================================ -->
    <rect x="88" y="660" width="728" height="78" rx="8"
          fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1"/>
    <rect x="88" y="660" width="728" height="36" fill="#0A4030" rx="8"/>
    <rect x="88" y="684" width="728" height="12" fill="#0A4030"/>
    <text x="452" y="684" font-size="13" font-weight="bold" fill="#FFFFFF"
          text-anchor="middle">Recover SAP HANA data</text>
    <text x="452" y="718" font-size="10" fill="#4A6A8A"
          text-anchor="middle">Restore databases using RSC, SAP HANA Studio, storage snapshots, archival, and replication.</text>
    <circle cx="60" cy="678" r="22" fill="#F4F7FA" stroke="#21DDAA" stroke-width="2.5"/>
    <text x="60" y="684" font-size="16" font-weight="bold" fill="#21DDAA"
          text-anchor="middle">6</text>

    <!-- Footer -->
    <rect x="0" y="762" width="840" height="22" fill="#0A2347" rx="0"/>
    <rect x="0" y="772" width="840" height="12" fill="#0A2347" rx="12"/>
    <text x="420" y="777" font-size="9" fill="#4A7A9A"
          text-anchor="middle">Rubrik Security Cloud &#x2014; SAP HANA Workloads</text>

</svg>
