<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="616"
     viewBox="0 0 960 616"
     font-family="Segoe UI, Calibri, Arial, sans-serif">
  <!-- Layout (custom decision-flow pattern, 960 x 616)
       Label column: circles cx=44, labels x=66.
       Left column (RSC-managed): x=216, w=350. Right column (Self-managed): x=578, w=350.
       Decision box: x=422 y=92 w=300 h=40. Column headers: y=164 h=34.
       Rows: y=212 + 52*i, h=44, i=0..6. Last row bottom=568. Footer top=594.
       Rows: 1 Plan, 2 Prepare and connect, 3 Compute and storage, 4 Verify (shared), 5 Protect, 6 Manage (shared), 7 Recover (shared). -->

  <!-- Background -->
  <rect width="960" height="616" fill="#F4F7FA" rx="12"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="960" height="72" fill="#0A2347" rx="12"/>
  <rect x="0" y="60" width="960" height="12" fill="#0A2347"/>
  <rect x="0" y="69" width="960" height="3" fill="#09A8B8"/>
  <text x="480" y="33" font-size="18" font-weight="bold" fill="#FFFFFF" letter-spacing="0.3" text-anchor="middle">Choose a deployment model, then follow its path</text>
  <text x="480" y="53" font-size="11" fill="#8AACCC" text-anchor="middle">Protecting AWS cloud accounts in RSC</text>

  <!-- Decision point -->
  <rect x="422" y="92" width="300" height="40" fill="#0C3460" rx="8"/>
  <text x="572" y="117" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Which deployment model?</text>

  <!-- Connectors from decision point to column headers -->
  <line x1="572" y1="132" x2="572" y2="148" stroke="#B0C8E0" stroke-width="2"/>
  <line x1="391" y1="148" x2="753" y2="148" stroke="#B0C8E0" stroke-width="2"/>
  <line x1="391" y1="148" x2="391" y2="160" stroke="#B0C8E0" stroke-width="2"/>
  <line x1="753" y1="148" x2="753" y2="160" stroke="#B0C8E0" stroke-width="2"/>
  <polygon points="384,156 391,164 398,156" fill="#09A8B8"/>
  <polygon points="746,156 753,164 760,156" fill="#09A8B8"/>

  <!-- Column headers -->
  <rect x="216" y="164" width="350" height="34" fill="#075F68" rx="6"/>
  <text x="391" y="186" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">RSC-managed (BaaS license)</text>
  <rect x="578" y="164" width="350" height="34" fill="#0C3460" rx="6"/>
  <text x="753" y="186" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Self-managed (UCL)</text>

  <!-- Phase 1: Plan and prerequisites -->
  <circle cx="44" cy="234" r="14" fill="#F4F7FA" stroke="#09A8B8" stroke-width="2.5"/>
  <text x="44" y="239" font-size="13" font-weight="bold" fill="#09A8B8" text-anchor="middle">1</text>
  <text x="66" y="238" font-size="10" font-weight="bold" fill="#1A2A3A">Plan for your model</text>
  <rect x="216" y="212" width="350" height="44" fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1" rx="6"/>
  <text x="391" y="238" font-size="10" fill="#1A2A3A" text-anchor="middle">Workloads, limits, permissions, storage and keys</text>
  <rect x="578" y="212" width="350" height="44" fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1" rx="6"/>
  <text x="753" y="238" font-size="10" fill="#1A2A3A" text-anchor="middle">Permissions, account setup options, and Exocompute</text>

  <!-- Phase 2: Connect the AWS account -->
  <circle cx="44" cy="286" r="14" fill="#F4F7FA" stroke="#09A8B8" stroke-width="2.5"/>
  <text x="44" y="291" font-size="13" font-weight="bold" fill="#09A8B8" text-anchor="middle">2</text>
  <text x="66" y="290" font-size="10" font-weight="bold" fill="#1A2A3A">Prepare and connect</text>
  <rect x="216" y="264" width="350" height="44" fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1" rx="6"/>
  <text x="391" y="290" font-size="10" fill="#1A2A3A" text-anchor="middle">Run the checklist, then add the account (IAM role only)</text>
  <rect x="578" y="264" width="350" height="44" fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1" rx="6"/>
  <text x="753" y="290" font-size="10" fill="#1A2A3A" text-anchor="middle">Complete prerequisites, then add the account</text>

  <!-- Phase 3: Set up compute -->
  <circle cx="44" cy="338" r="14" fill="#F4F7FA" stroke="#09A8B8" stroke-width="2.5"/>
  <text x="44" y="343" font-size="13" font-weight="bold" fill="#09A8B8" text-anchor="middle">3</text>
  <text x="66" y="342" font-size="10" font-weight="bold" fill="#1A2A3A">Compute and storage</text>
  <rect x="216" y="316" width="350" height="44" fill="#EEF4FA" stroke="#C8D8E8" stroke-width="1" rx="6"/>
  <text x="391" y="342" font-size="10" fill="#4A6A8A" text-anchor="middle">Not required. RSC provides the compute.</text>
  <rect x="578" y="316" width="350" height="44" fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1" rx="6"/>
  <text x="753" y="342" font-size="10" fill="#1A2A3A" text-anchor="middle">Set up Exocompute and, if used, storage tiering</text>

  <!-- Phase 4: Discover workloads (same for both) -->
  <circle cx="44" cy="390" r="14" fill="#F4F7FA" stroke="#09A8B8" stroke-width="2.5"/>
  <text x="44" y="395" font-size="13" font-weight="bold" fill="#09A8B8" text-anchor="middle">4</text>
  <text x="66" y="394" font-size="10" font-weight="bold" fill="#1A2A3A">Verify setup</text>
  <rect x="216" y="368" width="712" height="44" fill="#EEF4FA" stroke="#09A8B8" stroke-width="1.5" rx="6"/>
  <text x="572" y="394" font-size="10" fill="#1A2A3A" text-anchor="middle">Same for both: verify the account setup</text>

  <!-- Phase 5: Protect workloads -->
  <circle cx="44" cy="442" r="14" fill="#F4F7FA" stroke="#09A8B8" stroke-width="2.5"/>
  <text x="44" y="447" font-size="13" font-weight="bold" fill="#09A8B8" text-anchor="middle">5</text>
  <text x="66" y="446" font-size="10" font-weight="bold" fill="#1A2A3A">Protect workloads</text>
  <rect x="216" y="420" width="350" height="44" fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1" rx="6"/>
  <text x="391" y="446" font-size="10" fill="#1A2A3A" text-anchor="middle">RSC-managed SLA Domains (archive to Rubrik Cloud Vault)</text>
  <rect x="578" y="420" width="350" height="44" fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1" rx="6"/>
  <text x="753" y="446" font-size="10" fill="#1A2A3A" text-anchor="middle">Self-managed SLA Domains and archival locations</text>

  <!-- Phase 6: Verify and manage accounts (same for both) -->
  <circle cx="44" cy="494" r="14" fill="#F4F7FA" stroke="#09A8B8" stroke-width="2.5"/>
  <text x="44" y="499" font-size="13" font-weight="bold" fill="#09A8B8" text-anchor="middle">6</text>
  <text x="66" y="498" font-size="10" font-weight="bold" fill="#1A2A3A">Manage</text>
  <rect x="216" y="472" width="712" height="44" fill="#EEF4FA" stroke="#09A8B8" stroke-width="1.5" rx="6"/>
  <text x="572" y="498" font-size="10" fill="#1A2A3A" text-anchor="middle">Same for both: manage accounts and workloads</text>

  <!-- Phase 7: Recover (same for both) -->
  <circle cx="44" cy="546" r="14" fill="#F4F7FA" stroke="#21DDAA" stroke-width="2.5"/>
  <text x="44" y="551" font-size="13" font-weight="bold" fill="#21DDAA" text-anchor="middle">7</text>
  <text x="66" y="550" font-size="10" font-weight="bold" fill="#1A2A3A">Recover</text>
  <rect x="216" y="524" width="712" height="44" fill="#EEF4FA" stroke="#21DDAA" stroke-width="1.5" rx="6"/>
  <text x="572" y="550" font-size="10" fill="#1A2A3A" text-anchor="middle">Same for both: recover workloads</text>

  <!-- Footer -->
  <rect x="0" y="594" width="960" height="22" fill="#0A2347" rx="0"/>
  <rect x="0" y="604" width="960" height="12" fill="#0A2347" rx="12"/>
  <text x="480" y="609" font-size="9" fill="#4A7A9A" text-anchor="middle">Rows that span both columns are the same for both deployment models</text>

  <!-- Perimeter border -->
  <rect width="960" height="616" fill="none" stroke="#09A8B8" stroke-width="5" rx="12"/>
</svg>
