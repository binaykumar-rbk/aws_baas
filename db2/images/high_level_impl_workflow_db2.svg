<?xml version="1.0" encoding="UTF-8"?>
<!-- Height: 72 + 16 + 7*78 + 6*24 + 24 + 22 = 824px -->
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="824"
     viewBox="0 0 840 824"
     font-family="Segoe UI, Calibri, Arial, sans-serif">

    <!-- SVG background -->
    <rect width="840" height="824" fill="#F4F7FA" rx="12"/>

    <!-- Perimeter border -->
    <rect width="840" height="824" fill="none" stroke="#09A8B8" stroke-width="5" rx="12"/>

    <!-- Title bar -->
    <rect x="0" y="0" width="840" height="72" fill="#0A2347" rx="12"/>
    <rect x="0" y="60" width="840" height="12" fill="#0A2347"/>
    <rect x="0" y="69" width="840" height="3" fill="#09A8B8"/>
    <text x="420" y="34" font-size="18" font-weight="bold" fill="#FFFFFF"
          text-anchor="middle" letter-spacing="0.3">Db2 Protection Implementation Workflow</text>
    <text x="420" y="56" font-size="11" fill="#8AACCC"
          text-anchor="middle">RSC &#x2014; IBM Db2</text>

    <!-- Vertical connector line -->
    <line x1="60" y1="88" x2="60" y2="718"
          stroke="#B0C8E0" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- ============================================================ -->
    <!-- Phase 1: Plan Db2 protection (y=88) -->
    <!-- ============================================================ -->
    <rect x="88" y="88" width="728" height="78" rx="8"
          fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1"/>
    <rect x="88" y="88" width="728" height="36" fill="#075F68" rx="8"/>
    <rect x="88" y="112" width="728" height="12" fill="#075F68"/>
    <text x="452" y="112" font-size="13" font-weight="bold" fill="#FFFFFF"
          text-anchor="middle">Plan Db2 protection</text>
    <text x="452" y="146" font-size="10" fill="#4A6A8A"
          text-anchor="middle">Review workload requirements, configuration parameters, RBAC permissions, and limitations.</text>
    <circle cx="60" cy="106" r="22" fill="#F4F7FA" stroke="#09A8B8" stroke-width="2.5"/>
    <text x="60" y="112" font-size="16" font-weight="bold" fill="#09A8B8"
          text-anchor="middle">1</text>

    <!-- Arrow 1 to 2 -->
    <line x1="60" y1="166" x2="60" y2="175" stroke="#B0C8E0" stroke-width="2"/>
    <polygon points="53,175 60,183 67,175" fill="#09A8B8"/>

    <!-- ============================================================ -->
    <!-- Phase 2: Set up Db2 workload (y=190) -->
    <!-- ============================================================ -->
    <rect x="88" y="190" width="728" height="78" rx="8"
          fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1"/>
    <rect x="88" y="190" width="728" height="36" fill="#0C3460" rx="8"/>
    <rect x="88" y="214" width="728" height="12" fill="#0C3460"/>
    <text x="452" y="214" font-size="13" font-weight="bold" fill="#FFFFFF"
          text-anchor="middle">Set up Db2 workload</text>
    <text x="452" y="248" font-size="10" fill="#4A6A8A"
          text-anchor="middle">Add Db2 hosts and database instances; configure pureScale clusters if applicable.</text>
    <circle cx="60" cy="208" r="22" fill="#F4F7FA" stroke="#09A8B8" stroke-width="2.5"/>
    <text x="60" y="214" font-size="16" font-weight="bold" fill="#09A8B8"
          text-anchor="middle">2</text>

    <!-- Arrow 2 to 3 -->
    <line x1="60" y1="268" x2="60" y2="277" stroke="#B0C8E0" stroke-width="2"/>
    <polygon points="53,277 60,285 67,277" fill="#09A8B8"/>

    <!-- ============================================================ -->
    <!-- Phase 3: Set up protection (y=292) -->
    <!-- ============================================================ -->
    <rect x="88" y="292" width="728" height="78" rx="8"
          fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1"/>
    <rect x="88" y="292" width="728" height="36" fill="#0B3A72" rx="8"/>
    <rect x="88" y="316" width="728" height="12" fill="#0B3A72"/>
    <text x="452" y="316" font-size="13" font-weight="bold" fill="#FFFFFF"
          text-anchor="middle">Set up protection</text>
    <text x="452" y="350" font-size="10" fill="#4A6A8A"
          text-anchor="middle">Assign SLA Domains and configure archival, retention, snapshots, and Db2 performance settings.</text>
    <circle cx="60" cy="310" r="22" fill="#F4F7FA" stroke="#09A8B8" stroke-width="2.5"/>
    <text x="60" y="316" font-size="16" font-weight="bold" fill="#09A8B8"
          text-anchor="middle">3</text>

    <!-- Arrow 3 to 4 -->
    <line x1="60" y1="370" x2="60" y2="379" stroke="#B0C8E0" stroke-width="2"/>
    <polygon points="53,379 60,387 67,379" fill="#09A8B8"/>

    <!-- ============================================================ -->
    <!-- Phase 4: Manage Db2 objects (y=394) -->
    <!-- ============================================================ -->
    <rect x="88" y="394" width="728" height="78" rx="8"
          fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1"/>
    <rect x="88" y="394" width="728" height="36" fill="#075F68" rx="8"/>
    <rect x="88" y="418" width="728" height="12" fill="#075F68"/>
    <text x="452" y="418" font-size="13" font-weight="bold" fill="#FFFFFF"
          text-anchor="middle">Manage Db2 objects</text>
    <text x="452" y="452" font-size="10" fill="#4A6A8A"
          text-anchor="middle">Monitor dashboards, manage instances and databases, and review event logs.</text>
    <circle cx="60" cy="412" r="22" fill="#F4F7FA" stroke="#09A8B8" stroke-width="2.5"/>
    <text x="60" y="418" font-size="16" font-weight="bold" fill="#09A8B8"
          text-anchor="middle">4</text>

    <!-- Arrow 4 to 5 -->
    <line x1="60" y1="472" x2="60" y2="481" stroke="#B0C8E0" stroke-width="2"/>
    <polygon points="53,481 60,489 67,481" fill="#09A8B8"/>

    <!-- ============================================================ -->
    <!-- Phase 5: Configure high availability (y=496) -->
    <!-- ============================================================ -->
    <rect x="88" y="496" width="728" height="78" rx="8"
          fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1"/>
    <rect x="88" y="496" width="728" height="36" fill="#0C3460" rx="8"/>
    <rect x="88" y="520" width="728" height="12" fill="#0C3460"/>
    <text x="452" y="520" font-size="13" font-weight="bold" fill="#FFFFFF"
          text-anchor="middle">Configure high availability</text>
    <text x="452" y="554" font-size="10" fill="#4A6A8A"
          text-anchor="middle">Set up high availability clustering and High Availability Disaster Recovery (HADR).</text>
    <circle cx="60" cy="514" r="22" fill="#F4F7FA" stroke="#09A8B8" stroke-width="2.5"/>
    <text x="60" y="520" font-size="16" font-weight="bold" fill="#09A8B8"
          text-anchor="middle">5</text>

    <!-- Arrow 5 to 6 (recovery phase — green arrowhead) -->
    <line x1="60" y1="574" x2="60" y2="583" stroke="#B0C8E0" stroke-width="2"/>
    <polygon points="53,583 60,591 67,583" fill="#21DDAA"/>

    <!-- ============================================================ -->
    <!-- Phase 6: Recover Db2 (y=598, recovery accent) -->
    <!-- ============================================================ -->
    <rect x="88" y="598" width="728" height="78" rx="8"
          fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1"/>
    <rect x="88" y="598" width="728" height="36" fill="#0A4030" rx="8"/>
    <rect x="88" y="622" width="728" height="12" fill="#0A4030"/>
    <text x="452" y="622" font-size="13" font-weight="bold" fill="#FFFFFF"
          text-anchor="middle">Recover Db2</text>
    <text x="452" y="656" font-size="10" fill="#4A6A8A"
          text-anchor="middle">Restore Db2 databases and apply log backups through Db2 rollforward processes.</text>
    <circle cx="60" cy="616" r="22" fill="#F4F7FA" stroke="#21DDAA" stroke-width="2.5"/>
    <text x="60" y="622" font-size="16" font-weight="bold" fill="#21DDAA"
          text-anchor="middle">6</text>

    <!-- Arrow 6 to 7 -->
    <line x1="60" y1="676" x2="60" y2="685" stroke="#B0C8E0" stroke-width="2"/>
    <polygon points="53,685 60,693 67,685" fill="#09A8B8"/>

    <!-- ============================================================ -->
    <!-- Phase 7: Access Db2 reports (y=700) -->
    <!-- ============================================================ -->
    <rect x="88" y="700" width="728" height="78" rx="8"
          fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1"/>
    <rect x="88" y="700" width="728" height="36" fill="#0C3460" rx="8"/>
    <rect x="88" y="724" width="728" height="12" fill="#0C3460"/>
    <text x="452" y="724" font-size="13" font-weight="bold" fill="#FFFFFF"
          text-anchor="middle">Access Db2 reports</text>
    <text x="452" y="758" font-size="10" fill="#4A6A8A"
          text-anchor="middle">Create and view reports for Db2 protection, compliance, and capacity.</text>
    <circle cx="60" cy="718" r="22" fill="#F4F7FA" stroke="#09A8B8" stroke-width="2.5"/>
    <text x="60" y="724" font-size="16" font-weight="bold" fill="#09A8B8"
          text-anchor="middle">7</text>

    <!-- Footer -->
    <rect x="0" y="802" width="840" height="22" fill="#0A2347" rx="0"/>
    <rect x="0" y="812" width="840" height="12" fill="#0A2347" rx="12"/>
    <text x="420" y="817" font-size="9" fill="#4A7A9A"
          text-anchor="middle">Rubrik Security Cloud &#x2014; IBM Db2 Workloads</text>

</svg>
