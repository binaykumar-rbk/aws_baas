<?xml version="1.0" encoding="UTF-8"?>
<!-- Roll forward recovery 4-phase vertical workflow
     Canvas: 840 x 518px
     Phase heights: 78px each (1-line descriptions)
     Phase y: 88, 190, 292, 394 | Arrows: 166, 268, 370
     Footer: y=496 | Body ends at y=462 (34px above footer) -->
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="518"
     viewBox="0 0 840 518"
     font-family="Segoe UI, Calibri, Arial, sans-serif">

  <!-- Background -->
  <rect width="840" height="518" fill="#F4F7FA" rx="12"/>

  <!-- Perimeter border -->
  <rect width="840" height="518" fill="none" stroke="#09A8B8" stroke-width="5" rx="12"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="840" height="72" fill="#0A2347" rx="12"/>
  <rect x="0" y="60" width="840" height="12" fill="#0A2347"/>
  <rect x="0" y="69" width="840" height="3" fill="#09A8B8"/>
  <text x="420" y="34" font-size="18" font-weight="bold" fill="#FFFFFF"
        letter-spacing="0.3" text-anchor="middle">Roll Forward Recovery</text>
  <text x="420" y="57" font-size="11" fill="#8AACCC"
        text-anchor="middle">Microsoft Entra ID</text>

  <!-- Vertical connector line -->
  <line x1="60" y1="88" x2="60" y2="472"
        stroke="#B0C8E0" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Phase 1: Recover Domain (y=88) -->
  <rect x="88" y="88" width="728" height="78" rx="8"
        fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1"/>
  <rect x="88" y="88" width="728" height="36" fill="#075F68" rx="8"/>
  <rect x="88" y="112" width="728" height="12" fill="#075F68"/>
  <text x="452" y="112" font-size="13" font-weight="bold"
        fill="#FFFFFF" text-anchor="middle">Recover Domain</text>
  <circle cx="60" cy="106" r="22" fill="#F4F7FA"
          stroke="#09A8B8" stroke-width="2.5"/>
  <text x="60" y="112" font-size="16" font-weight="bold"
        fill="#09A8B8" text-anchor="middle">1</text>
  <text x="452" y="146" font-size="10" fill="#4A6A8A"
        text-anchor="middle">RSC restores the directory to the selected clean snapshot state.</text>

  <!-- Arrow 1 -->
  <line x1="60" y1="166" x2="60" y2="186" stroke="#B0C8E0" stroke-width="2"/>
  <polygon points="53,182 60,190 67,182" fill="#09A8B8"/>

  <!-- Phase 2: Classification (y=190) -->
  <rect x="88" y="190" width="728" height="78" rx="8"
        fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1"/>
  <rect x="88" y="190" width="728" height="36" fill="#0C3460" rx="8"/>
  <rect x="88" y="214" width="728" height="12" fill="#0C3460"/>
  <text x="452" y="214" font-size="13" font-weight="bold"
        fill="#FFFFFF" text-anchor="middle">Classification</text>
  <circle cx="60" cy="208" r="22" fill="#F4F7FA"
          stroke="#09A8B8" stroke-width="2.5"/>
  <text x="60" y="214" font-size="16" font-weight="bold"
        fill="#09A8B8" text-anchor="middle">2</text>
  <text x="452" y="248" font-size="10" fill="#4A6A8A"
        text-anchor="middle">RSC classifies each change as suspicious, legitimate, or unknown.</text>

  <!-- Arrow 2 -->
  <line x1="60" y1="268" x2="60" y2="288" stroke="#B0C8E0" stroke-width="2"/>
  <polygon points="53,284 60,292 67,284" fill="#09A8B8"/>

  <!-- Phase 3: Review Changes (y=292) -->
  <rect x="88" y="292" width="728" height="78" rx="8"
        fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1"/>
  <rect x="88" y="292" width="728" height="36" fill="#0B3A72" rx="8"/>
  <rect x="88" y="316" width="728" height="12" fill="#0B3A72"/>
  <text x="452" y="316" font-size="13" font-weight="bold"
        fill="#FFFFFF" text-anchor="middle">Review Changes</text>
  <circle cx="60" cy="310" r="22" fill="#F4F7FA"
          stroke="#09A8B8" stroke-width="2.5"/>
  <text x="60" y="316" font-size="16" font-weight="bold"
        fill="#09A8B8" text-anchor="middle">3</text>
  <text x="452" y="350" font-size="10" fill="#4A6A8A"
        text-anchor="middle">Review the classified changes and mark which ones to roll forward.</text>

  <!-- Arrow 3 (final — recovery/success) -->
  <line x1="60" y1="370" x2="60" y2="390" stroke="#B0C8E0" stroke-width="2"/>
  <polygon points="53,386 60,394 67,386" fill="#21DDAA"/>

  <!-- Phase 4: Roll Forward Changes (y=394) -->
  <rect x="88" y="394" width="728" height="78" rx="8"
        fill="#FFFFFF" stroke="#C8D8E8" stroke-width="1"/>
  <rect x="88" y="394" width="728" height="36" fill="#0A4030" rx="8"/>
  <rect x="88" y="418" width="728" height="12" fill="#0A4030"/>
  <text x="452" y="418" font-size="13" font-weight="bold"
        fill="#FFFFFF" text-anchor="middle">Roll Forward Changes</text>
  <circle cx="60" cy="412" r="22" fill="#F4F7FA"
          stroke="#21DDAA" stroke-width="2.5"/>
  <text x="60" y="418" font-size="16" font-weight="bold"
        fill="#21DDAA" text-anchor="middle">4</text>
  <text x="452" y="452" font-size="10" fill="#4A6A8A"
        text-anchor="middle">RSC rolls forward the marked changes and discards suspicious ones.</text>

  <!-- Footer -->
  <rect x="0" y="496" width="840" height="22" fill="#0A2347" rx="0"/>
  <rect x="0" y="506" width="840" height="12" fill="#0A2347" rx="12"/>
  <text x="420" y="511" font-size="9" fill="#4A7A9A"
        text-anchor="middle">Roll Forward Recovery &#x2014; Microsoft Entra ID</text>

</svg>
